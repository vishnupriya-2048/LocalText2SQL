[project]
name = "localtext2sql"
version = "0.1.0"
description = "Local Text-to-SQL chatbot: LangGraph agent, XiYanSQL via Ollama, Hindsight memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "hindsight-client>=0.10.2",
    "langgraph>=1.2.12",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "sqlglot>=30.20.0",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
